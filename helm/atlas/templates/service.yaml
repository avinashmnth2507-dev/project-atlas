apiVersion: v1
kind: Service
metadata:
  name: atlas-api
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "atlas.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
