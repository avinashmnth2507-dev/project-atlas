name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/avinashmnth2507-dev/project-atlas
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  ci:
    name: Validate API and container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_archive_sha256: ${{ steps.save_image_archive.outputs.sha256 }}
    permissions:
      contents: read

    steps:
      # actions/checkout v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v7.0.0
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Install project and development dependencies
        working-directory: app
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate Python syntax
        working-directory: app
        run: python -m compileall -q src tests run.py

      - name: Lint with Ruff
        working-directory: app
        run: python -m ruff check --select E4,E7,E9,F src tests run.py

      - name: Run tests
        working-directory: app
        run: python -m pytest -q

      - name: Check installed dependency consistency
        working-directory: app
        run: python -m pip check

      # Gitleaks v8.30.1; checksum is from the official release checksums file.
      - name: Install checksum-verified Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan checked-out source with Gitleaks
        run: |
          scan_dir="$(mktemp -d "${RUNNER_TEMP}/atlas-source.XXXXXX")"
          git ls-files -z | tar --null --files-from=- --create --file=- \
            | tar --extract --file=- --directory="$scan_dir"
          "${RUNNER_TEMP}/gitleaks" dir --no-banner --redact --exit-code 1 "$scan_dir"

      # docker/setup-buildx-action v4.4.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/build-push-action v7.4.0; load locally so Trivy scans the image before any publish.
      - name: Build local Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          load: true
          push: false

      # aquasecurity/trivy-action v0.36.0; Trivy CLI v0.76.1
      - name: Scan local Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-results.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          version: v0.76.1

      - name: Summarize findings and enforce CRITICAL gate
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from collections import Counter

          with open("trivy-results.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          findings = []
          for result in report.get("Results") or []:
              for vulnerability in result.get("Vulnerabilities") or []:
                  findings.append(
                      {
                          "severity": vulnerability.get("Severity") or "UNKNOWN",
                          "id": vulnerability.get("VulnerabilityID") or "unknown",
                          "target": result.get("Target") or "unknown",
                          "package": vulnerability.get("PkgName") or "unknown",
                          "installed": vulnerability.get("InstalledVersion") or "unknown",
                          "fixed": vulnerability.get("FixedVersion") or "not listed",
                      }
                  )

          counts = Counter(finding["severity"] for finding in findings)
          lines = [
              "### Trivy container vulnerability report",
              "",
              "- Scanner: Trivy CLI v0.76.1",
              f"- HIGH: **{counts['HIGH']}** (visible; currently non-blocking)",
              f"- CRITICAL: **{counts['CRITICAL']}** (blocking)",
              "",
          ]

          def markdown_cell(value):
              return (
                  str(value or "not listed")
                  .replace("|", "\\|")
                  .replace("\n", " ")
              )

          if findings:
              lines.extend(
                  [
                      "| Severity | Advisory | Target | Package | Installed | Fixed version |",
                      "| --- | --- | --- | --- | --- | --- |",
                  ]
              )
              severity_order = {"CRITICAL": 0, "HIGH": 1}
              for finding in sorted(
                  findings,
                  key=lambda item: (
                      severity_order.get(item["severity"], 2),
                      item["id"],
                      item["package"],
                  ),
              ):
                  cells = [
                      markdown_cell(finding[key])
                      for key in (
                          "severity",
                          "id",
                          "target",
                          "package",
                          "installed",
                          "fixed",
                      )
                  ]
                  lines.append("| " + " | ".join(cells) + " |")
          else:
              lines.append("No HIGH or CRITICAL findings were reported.")

          summary = "\n".join(lines)
          print(summary)
          with open(
              os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8"
          ) as summary_file:
              summary_file.write(summary + "\n")

          if counts["CRITICAL"]:
              sys.exit(f"CRITICAL vulnerability gate failed ({counts['CRITICAL']} findings).")
          PY

      - name: Save validated image archive for publishing
        id: save_image_archive
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          archive="${RUNNER_TEMP}/project-atlas-image.tar"
          docker save --output "$archive" "${IMAGE_NAME}:${IMAGE_TAG}"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf 'sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"

      # actions/upload-artifact v7.0.2; short retention for the scanned image handoff.
      - name: Transfer scanned image to the publish job
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-atlas-image-${{ github.sha }}
          path: ${{ runner.temp }}/project-atlas-image.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish validated image to GHCR
    needs: ci
    if: ${{ success() && needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      # actions/download-artifact v8.0.2; specify the artifact to avoid downloading Buildx records.
      - name: Download scanned image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: project-atlas-image-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Verify downloaded image archive checksum
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.ci.outputs.image_archive_sha256 }}
        run: |
          archive="${RUNNER_TEMP}/project-atlas-image.tar"
          if [[ ! "$EXPECTED_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Missing or invalid image archive SHA-256 output from CI."
            exit 1
          fi

          if ! printf '%s  %s\n' "$EXPECTED_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --status; then
            echo "::error::Downloaded image archive SHA-256 does not match the CI output."
            exit 1
          fi

          echo "Downloaded image archive SHA-256 verified."

      - name: Load scanned image archive
        run: docker load --input "${RUNNER_TEMP}/project-atlas-image.tar"

      # docker/login-action v4.6.0; GITHUB_TOKEN is scoped to this publish job.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish full-commit-SHA tag
        run: docker push "${IMAGE_NAME}:${IMAGE_TAG}"
