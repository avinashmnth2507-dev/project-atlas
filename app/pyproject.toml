[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Project Atlas - Production Grade DevOps Platform"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Avinash Mani Tripathi" }
]

dependencies = [
    "Flask>=3.1,<4.0",
    "gunicorn>=26.1,<27.0",
    "prometheus-client>=0.26,<0.27"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
