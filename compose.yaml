name: atlas-atlas003

services:
  api:
    image: project-atlas-api:0.1.0-atlas003-6461902
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5055:5000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
